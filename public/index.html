<!DOCTYPE html><html><head><meta charset="UTF-8"><title>DeepFlow</title></head><body><script>fetch('/api/candles?sym=SPY&interval=5m&range=5d').then(r=>r.json()).then(d=>{document.body.innerHTML='<h1 style="color:#26d97f;font-family:sans-serif;background:#0a0c10;min-height:100vh;margin:0;display:flex;align-items:center;justify-content:center">SPY: $'+d.regularMarketPrice?.toFixed(2)+'</h1>'}).catch(e=>document.body.innerHTML=e.message)</script></body></html>
