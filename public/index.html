<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>DeepFlow</title>
<style>
body{background:#0a0c10;color:#26d97f;font-family:sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;flex-direction:column;gap:16px}
h1{font-size:2rem}
#p{font-size:3rem;font-weight:700}
</style>
</head>
<body>
<h1>⚡ DeepFlow</h1>
<div id="p">جاري...</div>
<script>
fetch('/api/quote?symbols=SPY,NVDA,AAPL')
.then(r=>r.json())
.then(d=>{
  const r=d?.quoteResponse?.result||[];
  document.getElementById('p').innerHTML=r.map(q=>q.symbol+': $'+q.regularMarketPrice?.toFixed(2)).join('<br>');
})
.catch(e=>document.getElementById('p').textContent='خطأ: '+e.message);
</script>
</body>
</html>
